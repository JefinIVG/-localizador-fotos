<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Localizador de Fotos</title>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:20px;
    color:#222;
}

.caixa{
    max-width:1100px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px #bbb;
}

.cabecalho{
    height:150px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:2px solid #ddd;
    margin-bottom:20px;
}

.cabecalho h1{
    font-size:34px;
    margin:0;
}

.caminhao{
    position:absolute;
    left:0;
    bottom:0;
    width:170px;
    height:145px;
    object-fit:contain;
}

.logo{
    position:absolute;
    right:0;
    top:30px;
    width:190px;
    height:auto;
    object-fit:contain;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input[type=file]{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    margin-top:20px;
    padding:14px 25px;
    background:#333;
    color:white;
    border:0;
    border-radius:7px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#555;
}

#status{
    margin-top:20px;
    font-weight:bold;
}

.resultado{
    margin-top:20px;
    padding:15px;
    border:1px solid #ccc;
    border-radius:8px;
    background:#fafafa;
}

.resultado img{
    max-width:300px;
    max-height:220px;
    display:block;
    margin-top:10px;
    border-radius:6px;
}

.resultado a{
    display:inline-block;
    margin-top:10px;
}

.erro{
    color:#b00020;
}
</style>
</head>

<body>

<div class="caixa">

<div class="cabecalho">
    <img class="caminhao" src="caminhao_cabecalho.jpg" alt="Caminhão IVECO">
    <h1>Localizador de Fotos</h1>
    <img class="logo" src="logo_iveco.jpg" alt="IVECO">
</div>

<label>1. Escolha a foto que deseja procurar:</label>
<input type="file" id="foto" accept="image/*">

<label>2. Escolha os PowerPoints:</label>
<input type="file" id="ppt" accept=".pptx" multiple>

<button onclick="procurar()">PROCURAR FOTO</button>

<div id="status"></div>
<div id="resultados"></div>

</div>

<script>

function lerArquivo(file){
    return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(reader.result);
        reader.onerror=reject;
        reader.readAsArrayBuffer(file);
    });
}

function distancia(a,b){
    let total=0;
    for(let i=0;i<a.length;i++){
        total+=Math.abs(a[i]-b[i]);
    }
    return total/a.length;
}

async function assinatura(blob){
    return new Promise((resolve,reject)=>{
        const img=new Image();

        img.onload=()=>{
            const canvas=document.createElement("canvas");
            canvas.width=32;
            canvas.height=32;

            const ctx=canvas.getContext("2d");
            ctx.drawImage(img,0,0,32,32);

            const data=ctx.getImageData(0,0,32,32).data;
            const resultado=[];

            for(let i=0;i<data.length;i+=4){
                const cinza=
                    0.299*data[i]+
                    0.587*data[i+1]+
                    0.114*data[i+2];

                resultado.push(cinza);
            }

            resolve(resultado);
        };

        img.onerror=reject;
        img.src=URL.createObjectURL(blob);
    });
}

async function procurar(){

    const foto=document.getElementById("foto").files[0];
    const ppts=[...document.getElementById("ppt").files];

    const status=document.getElementById("status");
    const resultados=document.getElementById("resultados");

    resultados.innerHTML="";

    if(!foto){
        status.innerHTML='<span class="erro">Escolha a foto que deseja procurar.</span>';
        return;
    }

    if(ppts.length===0){
        status.innerHTML='<span class="erro">Escolha pelo menos um PowerPoint.</span>';
        return;
    }

    status.textContent="Analisando os arquivos... aguarde.";

    try{

        const assinaturaFoto=await assinatura(foto);
        const encontrados=[];

        for(const ppt of ppts){

            status.textContent="Analisando: "+ppt.name;

            const buffer=await lerArquivo(ppt);
            const zip=await JSZip.loadAsync(buffer);

            const arquivos=Object.keys(zip.files);

            const imagens=arquivos.filter(nome=>
                nome.startsWith("ppt/media/") &&
                /\.(jpg|jpeg|png|webp|bmp|gif|tif|tiff)$/i.test(nome)
            );

            for(const nome of imagens){

                const blob=await zip.files[nome].async("blob");

                try{

                    const assinaturaImagem=await assinatura(blob);
                    const d=distancia(assinaturaFoto,assinaturaImagem);

                    const url=URL.createObjectURL(blob);

                    encontrados.push({
                        ppt:ppt.name,
                        imagem:nome,
                        distancia:d,
                        url:url
                    });

                }catch(e){}

            }
        }

        encontrados.sort((a,b)=>a.distancia-b.distancia);

        const melhores=encontrados.slice(0,10);

        if(melhores.length===0){
            status.textContent="Nenhuma imagem encontrada nos PowerPoints.";
            return;
        }

        status.textContent=
            "Busca concluída. Foram encontradas "+
            encontrados.length+
            " imagens. Mostrando as 10 mais semelhantes.";

        melhores.forEach((item,index)=>{

            const similaridade=Math.max(
                0,
                Math.min(
                    100,
                    100-(item.distancia/2.55)
                )
            );

            const div=document.createElement("div");
            div.className="resultado";

            div.innerHTML=`
                <strong>Resultado ${index+1}</strong><br><br>
                <b>PowerPoint:</b> ${item.ppt}<br>
                <b>Imagem:</b> ${item.imagem}<br>
                <b>Semelhança aproximada:</b> ${similaridade.toFixed(1)}%
                <img src="${item.url}">
                <a href="${item.url}" target="_blank">Abrir imagem encontrada</a>
            `;

            resultados.appendChild(div);
        });

    }catch(erro){

        console.error(erro);

        status.innerHTML=
            '<span class="erro">Ocorreu um erro ao analisar os arquivos.</span>';
    }
}

</script>

</body>
</html>
